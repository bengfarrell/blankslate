[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blankslate"
version = "2.0.0"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Ben Farrell"}]
dependencies = [
    "hidapi>=0.14.0",
    "websockets>=11.0.0",
    "pyusb>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
blankslate-server = "blankslate.cli:main"
blankslate-udev-rules = "blankslate.udev:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["blankslate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
